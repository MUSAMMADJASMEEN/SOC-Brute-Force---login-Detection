name: Run SOC Analyzer

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run analyzer
        run: python analyzer.py

      - name: Save alerts
        uses: actions/upload-artifact@v7
        with:
          name: security-alerts
          path: logs/alerts.txt
          if-no-files-found: ignore
